<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>
<h1>Student Registration Form</h1>
<form>
    <label>Name:</label>
    <input type="text" name="name">
    <br><br>

    <label>Email:</label>
    <input type="email" name="email">
    <br><br>

    <label>Password:</label>
    <input type="password" name="password">
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br><br>

    <label>Interests:</label><br>
    <input type="checkbox" name="interest" value="programming"> Programming
    <br>
    <input type="checkbox" name="interest" value="web"> Web Development
    <br>
    <input type="checkbox" name="interest" value="gaming"> Gaming
        <br><br>

    <label>Department:</label>
    <select name="department">
        <option>Computing</option>
        <option>Business</option>
        <option>Cyber Security</option>
        <option>Networking</option>
    </select>
        <br><br>

    <label>About You:</label><br>
    <textarea name="about" rows="5" cols="30"></textarea>
    <br><br>

    <input type="submit" value="Submit">

</form>
</body>
</html>
